
# netlify.toml — retrospectives.pagerduty.com
# This site now only redirects to docs.pagerduty.com/ops-guides/retrospectives.
 
# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
# These are attached to the 301 responses too. Referrer-Policy matters here:
# a redirect response's Referrer-Policy is applied to the follow-up request,
# so "same-origin" would strip the referrer when the browser goes on to
# docs.pagerduty.com (cross-origin), and docs analytics would lose the
# original traffic source (Google, blogs, Slack, etc.).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
 
# ---------------------------------------------------------------------------
# Redirects — first match wins. Keep the catch-all LAST.
# force = true is required because the old MkDocs build output (if still
# deployed) would otherwise shadow these rules.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/"
  to = "https://docs.pagerduty.com/ops-guides/retrospectives"
  status = 301
  force = true
 
[[redirects]]
  from = "/getting_started/*"
  to = "https://docs.pagerduty.com/ops-guides/retrospectives/getting-started"
  status = 301
  force = true
 
[[redirects]]
  from = "/planning/*"
  to = "https://docs.pagerduty.com/ops-guides/retrospectives/planning"
  status = 301
  force = true
 
[[redirects]]
  from = "/during/*"
  to = "https://docs.pagerduty.com/ops-guides/retrospectives/during"
  status = 301
  force = true
 
[[redirects]]
  from = "/after/*"
  to = "https://docs.pagerduty.com/ops-guides/retrospectives/after"
  status = 301
  force = true
 
[[redirects]]
  from = "/facilitator_training/*"
  to = "https://docs.pagerduty.com/ops-guides/retrospectives/facilitator-training"
  status = 301
  force = true
 
[[redirects]]
  from = "/next_steps/*"
  to = "https://docs.pagerduty.com/ops-guides/retrospectives/next-steps"
  status = 301
  force = true
 
[[redirects]]
  from = "/resources/*"
  to = "https://docs.pagerduty.com/ops-guides/retrospectives/additional-resources"
  status = 301
  force = true
 
# Catch-all: assets, sitemap.xml, search index, unknown/mistyped URLs
[[redirects]]
  from = "/*"
  to = "https://docs.pagerduty.com/ops-guides/retrospectives"
  status = 301
  force = true
 